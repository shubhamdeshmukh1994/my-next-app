name: Deploy to ECS
on:
  push:
    branches: [master]

env:
  AWS_REGION: us-east-1
  ECR_REPO: myapp
  CLUSTER: myapp-dev-cluster
  SERVICE: myapp-service

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr

- name: Build and push image
        run: |
          docker build --build-arg NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }} --build-arg NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }} --build-arg NEXT_PUBLIC_POSTHOG_KEY=${{ secrets.NEXT_PUBLIC_POSTHOG_KEY }} --build-arg NEXT_PUBLIC_POSTHOG_HOST=${{ secrets.NEXT_PUBLIC_POSTHOG_HOST }} -t ${{ steps.ecr.outputs.registry }}/$ECR_REPO:latest .
          docker push ${{ steps.ecr.outputs.registry }}/$ECR_REPO:latest

      - name: Update task definition with new image
        run: |
          aws ecs describe-task-definition --task-definition myapp-task \
            --query taskDefinition > task-def-current.json
          jq '.containerDefinitions[0].image = "'${{ steps.ecr.outputs.registry }}'/'$ECR_REPO':latest"' \
            task-def-current.json | jq 'del(.taskDefinitionArn,.revision,.status,.requiresAttributes,.compatibilities,.registeredAt,.registeredBy)' > new-task-def.json
          aws ecs register-task-definition --cli-input-json file://new-task-def.json

      - name: Deploy to ECS
        run: |
          aws ecs update-service --cluster $CLUSTER --service $SERVICE \
            --task-definition myapp-task --force-new-deployment